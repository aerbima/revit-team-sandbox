name: yougile-tasks                                             # создать карточки YouGile из файлов tasks/

on:                                                            # только ручной запуск
  workflow_dispatch:                                           # кнопка Run workflow во вкладке Actions или gh workflow run

permissions:                                                   # скрипту достаточно читать репозиторий
  contents: read                                               # таски и plan.json

jobs:                                                          # одно задание
  create:                                                      # создание карточек
    runs-on: ubuntu-latest                                     # Python есть на раннере
    steps:                                                     # шаги
      - uses: actions/checkout@v4                              # таски, plan.json и скрипты
      - run: python3 tools/yougile/create_tasks.py             # повторный запуск не плодит дубликаты
        env:                                                   # ключ и доска
          YOUGILE_API_KEY: ${{ secrets.YOUGILE_API_KEY }}      # секрет репозитория
          YG_BOARD_ID: ${{ vars.YG_BOARD_ID }}                 # переменная репозитория
          YG_API_BASE: ${{ vars.YG_API_BASE }}                   # адрес API YouGile (en./ru./без префикса)
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}  # ссылка на файл таска в описании карточки
